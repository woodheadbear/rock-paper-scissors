<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Rock Paper Scissors</title>
</head>

<body>
    <div class="game">
        <img src="images/logo.png" alt="rock paper scissors by human hands" class="logo">
        <h1>Rock Paper Scissors</h1>
        <div id="human-choice">
            <button>Rock</button>
            <button>Paper</button>
            <button>Scissors</button>
        </div>

        <div id="result">
            <p id="info"></p>
            <p id="score"></p>
            <h3 id="winner"></h3>
        </div>

        <div id="restart">
            <button>Restart</button>
        </div>
    </div>
</body>

</html>
